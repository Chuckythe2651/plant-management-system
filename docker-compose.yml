version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: plantmgr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-plantdb}
      POSTGRES_USER: ${DB_USER:-plantuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plantpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-plantuser} -d ${DB_NAME:-plantdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - plant-net

  # ── Backend API ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plantmgr-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-plantdb}
      DB_USER: ${DB_USER:-plantuser}
      DB_PASSWORD: ${DB_PASSWORD:-plantpass}
      CORS_ORIGIN: "*"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - plant-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plantmgr-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - plant-net

# ── Persistent Volumes ──────────────────────────────────
volumes:
  pgdata:
    name: plantmgr-pgdata
  uploads:
    name: plantmgr-uploads

# ── Network ─────────────────────────────────────────────
networks:
  plant-net:
    name: plantmgr-network
    driver: bridge
